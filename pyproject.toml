[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmos"
version = "0.1.0"
description = "PM OS — multi-agent orchestrator for end-to-end product workflow"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # tests build httpx.Request/Response for adapter error cases
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["pmos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results don't change with ruff's default selection.
# E4/E7/E9/F: ruff's long-standing baseline. The rest are exactly the rules
# ruff 0.17.4's defaults reported on this codebase on 2026-11-08.
select = ["E4", "E7", "E9", "F", "I001", "UP017", "UP035", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
